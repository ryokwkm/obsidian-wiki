description: Obsidian wiki 一式（記憶第3層の CLAUDE.md 断片 + skills 7 個 + doc 2 本 + 保守の催促とサイズメーターの hook）
# ON にするのは claude-global/llmtpl.conf（user スコープ）だけ。defaults.conf に書くと全
# プロジェクトの .claude/{skills,hooks}/ へ二重配布される（設計 doc §5.4）。
# フラグ OFF で規約・skills・hook 登録が同時に消えるキルスイッチとして設計してある。
#
# ⚠️ llmtpl 固有の制約: このバンドルから配る doc は必ず `doc_wiki_` で始めること。
# `claude-global/doc/` は実体と生成 symlink が混在する唯一のディレクトリで、.gitignore が
# `claude-global/doc/doc_wiki_*.md` で両者を分けている（ディレクトリ丸ごとは除外できない）。
#
# 設計判断の理由・棄却案・実測の経緯はここに書かない。正典は作者の私的 vault
# （⚠️ このリポジトリには含まれない、作者環境向けのポインタ）:
#   [[concepts/wiki-kill-switch]] — hook をバンドル側に置く理由、催促・メーター・qmd_refresh の設計
#   [[concepts/vault-topology]]   — vault と .manifest.json の実態
#
# 構成の受け入れ条件（cross-skill 参照 0 件 / skill 本数 / hook が促す skill の実在 / qmd を
# 変数で呼ばない 等）は、作者の配布元リポジトリの wiki 系テスト 4 本が機械で縛る。

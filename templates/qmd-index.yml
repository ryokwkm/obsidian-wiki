# qmd（Markdown 検索 CLI・任意依存）の collection 定義サンプル。
# 置き場所: ~/.config/qmd/index.yml
# collection 名は vault ディレクトリ名と同一にし、settings.json の QMD_WIKI_COLLECTION と
# 一致させる。qmd が collection add / remove でこのファイルを再生成するとコメントは失われる。
#
# ignore リスト: wiki skill が直接 Read する運用ファイルと作業領域を検索対象から外す。
# log.md は全操作の note を 1 ファイルに溜めるため、wiki 系クエリでほぼ必ず上位に来てしまう。
# hot.md / index.md も skill が Read する派生ビューなので検索には冗長。
# _source_docs/ は ingest 元の原本コピー。蒸留ページと近重複なので同じ索引に入れると同じ枝を
# 奪い合い、蒸留で直した数字が原本側から同じ重みで戻ってくる。原本へは蒸留ページの sources: から辿る。
collections:
  my-vault:
    path: /path/to/your/vault
    pattern: "**/*.md"
    ignore:
      - "hot.md"
      - "index.md"
      - "log.md"
      - "_raw/**"
      - "_source_docs/**"
      - "_staging/**"
      - "_archives/**"
      - "_state/**"
models:
  embed: hf:ggml-org/embeddinggemma-300M-GGUF/embeddinggemma-300M-Q8_0.gguf
  generate: hf:tobil/qmd-query-expansion-1.7B-gguf/qmd-query-expansion-1.7B-q4_k_m.gguf
